name: Peerflix Media Network
description: Peerflix Media Network was a Palo Alto, California online movie vertical advertising
  network that grew out of Peerflix, a peer-to-peer DVD-trading marketplace backed by Battery Ventures,
  3i Group, and BV Capital (~$10M raised across two rounds). Peerflix shut down its DVD trading marketplace
  in April 2008 and continued briefly as the ad-focused Peerflix Media Network before being acquired by
  LiveUniverse in September 2008. The company is defunct; its domain (peerflixmedianetwork.com) no longer
  resolves and it exposes no developer platform, documentation, or API surface. Retained in the API
  Evangelist network as a Battery Ventures portfolio-history record.
